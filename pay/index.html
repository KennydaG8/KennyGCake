<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KennyG Cake 現場 LINE Pay 付款入口">
  <meta name="referrer" content="no-referrer">
  <title>現場付款｜KennyG Cake</title><link rel="stylesheet" href="pay.css">
</head>
<body><div class="page-shell">
  <header class="campaign-header"><a class="campaign-brand" href="../"><img src="../images/kennyg-logo.png" alt="KennyG Cake" width="48" height="48"><span><strong>KennyG Cake</strong><small>現場付款</small></span></a><span class="unlisted-badge">LINE Pay</span></header>
  <main id="main" aria-live="polite">
    <section id="loading-state" class="state-card centered-state"><span class="spinner"></span><p>正在載入付款品項…</p></section>
    <section id="error-state" class="state-card centered-state" hidden><h1>付款頁暫時無法使用</h1><p id="error-message"></p></section>
    <div id="campaign-content" hidden>
      <section class="hero-card"><div><p class="eyebrow">On-site payment</p><h1>現場選購與付款</h1><p class="subtitle">選擇品項後使用 LINE Pay 完成付款</p></div><div class="cold-note"><span>✓</span><p>付款前請再次確認品項與數量。</p></div></section>
      <section class="products-section"><div class="section-heading"><p class="eyebrow">Choose items</p><h2>選擇付款品項</h2><p id="pricing-copy"></p></div><div id="product-list" class="product-list"></div></section>
      <section class="checkout-card"><div class="section-heading"><p class="eyebrow">Payment details</p><h2>填寫付款資料</h2><p>資料僅供付款核對使用。</p></div>
        <form id="order-form" novalidate><div class="field-grid">
          <label>姓名 <span>必填</span><input name="customerName" autocomplete="name" maxlength="50" required></label>
          <label>手機 <span>必填</span><input name="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="09xxxxxxxx 或 +886" required></label>
          <label class="full-width">備註 <small>選填</small><textarea name="note" rows="2" maxlength="300"></textarea></label>
        </div><p id="form-message" class="form-message" role="alert"></p>
        <div class="checkout-summary"><p>本次付款</p><strong><span id="total-quantity">0</span> 項｜<span id="total-amount">NT$0</span></strong></div>
        <button id="checkout-button" type="submit" disabled>請先選擇品項</button><p class="payment-note">送出後將前往 LINE Pay 安全付款頁。</p></form>
      </section>
    </div>
  </main><footer class="campaign-footer"><strong>KennyG Cake</strong><span>現場付款入口</span></footer>
</div><script type="module" src="pay.js"></script></body></html>
