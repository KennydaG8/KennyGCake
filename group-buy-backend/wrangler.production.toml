name = "kennygcake-group-buy-api-production"
main = "src/index.ts"
compatibility_date = "2026-08-20"
workers_dev = true

[assets]
directory = "../group-buy"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kennygcake-group-buy-production"
database_id = "8e7e23cc-616f-41b8-b21a-85b54a200c01"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://kennygcake.com"
PUBLIC_API_BASE_URL = "https://kennygcake-group-buy-api-production.kennygcake-group-buy-backend.workers.dev"
LINE_PAY_API_BASE_URL = "https://api-pay.line.me"
PAYMENT_ENABLED_CAMPAIGNS = "gongxin,onsite-pay,bigdata"
# Company order page. ORDER_NOTIFY_SECRET is a Worker secret; it must equal the PAID_SECRET script property in Apps Script.
ORDER_PAGE_URL = "https://kennygcake.com/order/"
ORDER_NOTIFY_URL = "https://script.google.com/macros/s/AKfycbw2Kiu6Bp3odWZkNVEFexEdSh0pynd1fj5pU29W7okjvJJH-6Zi3Uua1Fxkfl-1mJky/exec"

[triggers]
crons = ["*/10 * * * *"]
